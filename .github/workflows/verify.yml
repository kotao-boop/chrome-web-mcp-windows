name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv and locked dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra test
      - name: Lint product and test code
        run: uvx --from ruff==0.16.6 ruff check --select E4,E7,E9,F,I src tests scripts
      - name: Type-check product code
        shell: pwsh
        run: |
          $pythonPath = (Resolve-Path ".venv\Scripts\python.exe").Path
          uvx --from pyright==1.1.411 pyright --project pyrightconfig.json --pythonpath $pythonPath
      - name: Ensure Chrome is available
        shell: pwsh
        run: |
          uv run --locked python -c "from chrome_web_mcp.platform_runtime import discover_chrome, chrome_version; b=discover_chrome(); print(b); print(chrome_version(b))"
          if ($LASTEXITCODE -ne 0) {
            uv run --locked python scripts/install-chrome-for-testing.py
            uv run --locked python -c "from chrome_web_mcp.platform_runtime import discover_chrome, chrome_version; b=discover_chrome(); print(b); print(chrome_version(b))"
          }
      - name: Run deterministic tests including real-browser security fixtures
        env:
          CW_DISPLAY_MODE: headless
        run: uv run --locked python -m pytest -q -m "not live"
      - name: Build wheel and source distribution
        run: uv run --locked python -m build
