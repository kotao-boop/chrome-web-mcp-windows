# Codex Desktop / Codex CLI configuration for a local Windows checkout.
# Merge this server block into %USERPROFILE%\.codex\config.toml and replace
# C:\Users\YOU with the account and checkout path on your machine.

[mcp_servers.chrome-web]
command = 'C:\Users\YOU\chrome-web-mcp-windows\.venv\Scripts\chrome-web-mcp.exe'
args = []
cwd = 'C:\Users\YOU\chrome-web-mcp-windows'
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled = true

[mcp_servers.chrome-web.env]
# Use "headless" instead when no interactive Windows desktop is available.
CW_DISPLAY_MODE = "hidden"
